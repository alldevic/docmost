<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16x16.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0 user-scalable=no" />
    <title>Docmost</title>
    <meta name="theme-color" content="#1f1f1f" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f6f7f9" media="(prefers-color-scheme: light)" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/icons/app-icon-192x192.png" />
    <meta name="application-name" content="Docmost" />
    <meta name="description" content="Open-source collaborative wiki and knowledge base" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-touch-fullscreen" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Docmost" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <!--meta-tags-->
  </head>
  <body>
    <div id="root"></div>

    <!--window-config-->

    <script>
      // Start the first API requests while the app bundle is still downloading.
      // lib/prefetch.ts hands the responses to the first matching API call.
      (function () {
        try {
          var post = function (path, body) {
            return fetch("/api" + path, {
              method: "POST",
              credentials: "include",
              headers: { "content-type": "application/json" },
              body: JSON.stringify(body || {}),
            });
          };
          var pf = (window.__prefetch = {});
          if (/^\/(login|share|invites|setup|forgot-password|password-reset)/.test(location.pathname)) return;
          pf["/users/me"] = post("/users/me");
          var m = location.pathname.match(/^\/s\/[^/]+\/p\/([^/?#]+)/);
          if (m) {
            // same rule as extractPageSlugId: a UUID as is, else the part after the last "-"
            var slug = decodeURIComponent(m[1]);
            var isUuid = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(slug);
            var id = isUuid ? slug : slug.split("-").pop();
            pf["/pages/info:" + id] = post("/pages/info", { pageId: id });
          }
        } catch (e) {}
      })();
    </script>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
